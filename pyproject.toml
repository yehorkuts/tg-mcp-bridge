[project]
name = "tg-mcp-bridge"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "sqlalchemy>=2.1.8",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette's TestClient nudges towards a separate client package; httpx is our pinned HTTP client.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
